<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <div id="myDIV" class="header">
      <h2>My To Do List</h2>
      <div class="inputWrapper">
        <div class="chooseButton" id="chooseBtn">
            <img src="images/magnifying-glass.png" alt="search" class="search" id="searchid"/>
        </div>
        <input type="text" id="myInput" placeholder="Title..." />
        <span onclick="newElement()" class="addBtn">Enter</span>
      </div>
    </div>
  </head>
  <body>
    <ul id="myUL">
      <li>Hit the gym</li>
      <li class="checked">Pay bills</li>
      <li>Meet George</li>
      <li>Buy eggs</li>
      <li>Read a book</li>
      <li>Organize office</li>
    </ul>
    <script src="script.js"></script>
  </body>
</html>
